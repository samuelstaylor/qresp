version: "3.7"

services:
  db:
    # mongo:4.4 matches the production compose default. The previous
    # mongo:3.6.18-xenial is EOL AND unsupported by PyMongo 4.17 (requires
    # MongoDB server >= 4.0), so the dev DB would no longer connect at all.
    image: "mongo:4.4"
    # Named volume instead of hard-coded host paths. The old config required
    # ~/Repositories/MongoDB/{.env,init-mongo.js,QrespData}, which don't exist on
    # a clean checkout. A fresh no-auth dev DB needs no env_file/init script.
    volumes:
      - qresp_mongo_dev_data:/data/db
    networks:
      - backend

  backend:
    depends_on:
      - db
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      - PYTHONUNBUFFERED=TRUE
      # Connect to the dev "db" service (read by project/config.py via QRESP_*).
      - QRESP_MONGODB_HOST=db
      - QRESP_MONGODB_PORT=27017
      - QRESP_MONGODB_DB_NAME=explorer
    volumes:
      - ./backend:/home/flask/app/web/
    networks:
      - backend
    # Connexion 3 is ASGI. watchfiles (used by uvicorn --reload) panics on
    # Python 3.14 in this environment; code is bind-mounted so changes are
    # live without auto-reload.
    command: python -m uvicorn project:connexionapp --host 0.0.0.0 --port 5000

  gui:
    restart: always
    depends_on: 
      - db
    environment: 
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/usr/src/app
      # Preserve the node_modules installed during image build — the bind-mount
      # above would otherwise overwrite /usr/src/app and wipe them out.
      - /usr/src/app/node_modules
    networks:
      - frontend
    command: yarn dev
  
  nginx:
    depends_on: 
      - backend
      - gui
    restart: always
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    ports:
      - "8444:443"
      - "8081:80"
    networks: 
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  qresp_mongo_dev_data:
      
